<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vão · o que tem em São Paulo</title>
<meta name="description" content="Guia pessoal de cultura em São Paulo: teatro, shows, samba, dança, concerto, cinema e exposições.">
<meta name="theme-color" content="#d6d3cc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vão">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Norte: lambe-lambe de tipo de madeira (Gráfica Fidalga, Vila Madalena) colado no concreto
   de fôrma de tábua do Sesc Pompeia (Lina Bo Bardi). Cada grupo é uma cor de papel de cartaz;
   a tinta é preta; a retícula e o registro fora do lugar são da impressão tipográfica. Marca: o vão do MASP. */
:root{
  --bg:#d6d3cc; --bg2:#cbc8c0; --papel:#f3f0e9; --tinta:#131312; --mudo:#5b5852; --fio:#b3afa6; --fio2:#9f9b92;
  --lina:#d7261e; --ok:#0f7a43; --aviso:#c0281f;
  --disp:"League Gothic","Oswald","Arial Narrow",Impact,sans-serif;
  --txt:"Barlow",system-ui,sans-serif; --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --nav:64px; --topo:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151514; --bg2:#1b1b1a; --papel:#232321; --tinta:#eeebe4; --mudo:#a6a299; --fio:#363532; --fio2:#4a4945;
    --lina:#ff5a4e; --ok:#4cc98a; --aviso:#ff7b70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151514; --bg2:#1b1b1a; --papel:#232321; --tinta:#eeebe4; --mudo:#a6a299; --fio:#363532; --fio2:#4a4945;
  --lina:#ff5a4e; --ok:#4cc98a; --aviso:#ff7b70; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topo) + 64px)}
body{margin:0;color:var(--tinta);font-family:var(--txt);font-size:16px;line-height:1.38;font-variant-numeric:tabular-nums;
  background-color:var(--bg);
  /* fôrma de tábua: faixas horizontais irregulares, quase invisíveis */
  background-image:repeating-linear-gradient(180deg, transparent 0 21px, rgba(0,0,0,.035) 21px 22px, transparent 22px 47px, rgba(255,255,255,.05) 47px 48px, transparent 48px 69px);
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--lina);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.casca{max-width:1240px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* ---------- topo ---------- */
.topo{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:3px solid var(--tinta)}
.topo .casca{display:flex;align-items:center;gap:10px;height:var(--topo)}
.marca{display:flex;align-items:center;gap:9px;margin:0;font:400 2.15rem/1 var(--disp);letter-spacing:.01em;text-transform:uppercase;text-decoration:none;color:var(--tinta)}
.marca svg{width:38px;height:26px;flex:none}
.marca>span{display:flex;flex-direction:column}
.marca small{font:600 .62rem/1 var(--cond);letter-spacing:.1em;color:var(--mudo);text-transform:uppercase;margin-top:1px}
.topo .esp{flex:1}
.abas-topo{display:none;gap:2px}
.abas-topo button{border:0;background:none;padding:8px 12px;font:600 .82rem/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;margin-bottom:-3px;height:var(--topo)}
.abas-topo button[aria-selected="true"]{border-bottom-color:var(--lina)}
.ico{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--tinta);background:var(--papel);flex:none;position:relative}
.ico svg{width:20px;height:20px}
.ico[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}
.ico .bolinha{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--lina);color:#fff;font:700 .7rem/18px var(--txt)}
@media (min-width:860px){ .abas-topo{display:flex} .nav{display:none!important} body{padding-bottom:0} }

/* busca */
.busca{position:sticky;top:var(--topo);z-index:25;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--fio)}
.busca .casca{position:relative}
.busca input{width:100%;border:2px solid var(--tinta);background:var(--papel);padding:12px 44px 12px 42px;font-size:1.02rem;border-radius:0;-webkit-appearance:none}
.busca .lupa{position:absolute;left:30px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mudo)}
.busca .x{position:absolute;right:22px;top:50%;transform:translateY(-50%);border:0;background:none;width:40px;height:40px;display:grid;place-items:center}

/* nav inferior (celular) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:3px solid var(--tinta);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 .66rem/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--mudo);position:relative;min-width:0}
.nav svg{width:26px;height:18px}
.nav button[aria-selected="true"]{color:var(--tinta)}
.nav button[aria-selected="true"] .f{fill:currentColor}
.nav button[aria-selected="true"]::before{content:"";position:absolute;top:-3px;left:22%;right:22%;height:4px;background:var(--lina)}
.nav .n{position:absolute;top:7px;left:calc(50% + 10px);font:700 .66rem/16px var(--txt);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--lina);color:#fff;letter-spacing:0}

/* ---------- janelas ---------- */
.barra{display:flex;gap:8px;align-items:stretch;margin:14px 0 0}
.janelas{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.janelas::-webkit-scrollbar{display:none}
.janelas button{flex:1 1 0;min-width:0;border:2px solid var(--tinta);background:var(--papel);padding:6px 6px 5px;text-align:left}
.janelas b{display:block;font:400 1.55rem/1 var(--disp)}
.janelas span{display:block;font:600 .68rem/1.1 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--mudo)}
.janelas button[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}
.janelas button[aria-pressed="true"] span{color:inherit;opacity:.75}
.bfiltro{width:56px}
@media (min-width:860px){.janelas{flex:none}.janelas button{flex:none;width:112px}.barra{justify-content:space-between}}
.datas{display:none;gap:8px;margin-top:8px;flex-wrap:wrap}
.datas.on{display:flex}
.datas label{display:grid;gap:3px;flex:1;min-width:140px;font:600 .7rem/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--mudo)}
.datas input{border:2px solid var(--tinta);background:var(--papel);padding:8px;border-radius:0;font-size:.95rem}

/* ---------- o muro (mosaico de grupos, área = quantidade) ---------- */
.muro{position:relative;margin:14px 0 6px;background:var(--bg2);outline:1px solid var(--fio)}
.lambe{position:absolute;border:0;padding:8px 9px;text-align:left;overflow:hidden;background:var(--cor);color:var(--tc);display:flex;flex-direction:column;justify-content:space-between;transition:opacity .15s, filter .15s}
.lambe::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:radial-gradient(circle, rgba(0,0,0,.28) 1.1px, transparent 1.5px);background-size:6px 6px;
  -webkit-mask-image:linear-gradient(135deg, transparent 38%, #000 100%);mask-image:linear-gradient(135deg, transparent 38%, #000 100%)}
.lambe .nm{font:400 var(--fs,28px)/.86 var(--disp);text-transform:uppercase;letter-spacing:.005em;position:relative;z-index:1;
  text-shadow:var(--reg,0) var(--reg,0) 0 var(--sobre)}
.lambe .nn{font:700 var(--fn,15px)/1 var(--txt);position:relative;z-index:1;align-self:flex-start;opacity:.9}
.lambe.dobra::before{content:"";position:absolute;right:0;top:0;width:26px;height:26px;background:linear-gradient(225deg, var(--bg2) 50%, rgba(255,255,255,.55) 50%);z-index:2}
.muro.filtrando .lambe[aria-pressed="false"]{opacity:.28;filter:grayscale(.6)}
.lambe[aria-pressed="true"]{box-shadow:inset 0 0 0 4px var(--tinta)}
.muro-rodape{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 .82rem/1.3 var(--cond);letter-spacing:.04em;color:var(--mudo);margin:6px 0 0}
.muro-rodape .ativos{color:var(--tinta);font-weight:700}
.muro-rodape button{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;font:inherit;color:var(--tinta)}

/* ---------- seções e cartazes ---------- */
.secao{margin:34px 0 0}
.secao-cab{display:flex;align-items:flex-end;gap:10px;border-bottom:3px solid var(--tinta);padding-bottom:4px;margin-bottom:12px}
.secao-cab h2{margin:0;font:400 3rem/.82 var(--disp);text-transform:uppercase;letter-spacing:.005em;text-shadow:3px 2px 0 var(--cor)}
.secao-cab .q{font:600 .9rem/1 var(--cond);letter-spacing:.06em;color:var(--mudo);padding-bottom:5px}
.secao-cab .ver{margin-left:auto;border:0;background:none;padding:6px 0 5px;min-height:44px;font:700 .8rem/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.secao-cab .ver::after{content:" →"}
.secao-cab .faixa{width:14px;align-self:stretch;background:var(--cor);margin-bottom:-4px;flex:none}
.trilho{display:grid;grid-auto-flow:column;grid-auto-columns:min(74vw,290px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:thin;overscroll-behavior-x:contain}
.trilho>*{scroll-snap-align:start}
.grade{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:560px){.grade{grid-template-columns:1fr 1fr}}
@media (min-width:860px){.trilho{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:repeat(4,1fr);overflow:visible;margin:0;padding:2px 0 0}.grade{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1120px){.grade{grid-template-columns:repeat(4,1fr)}}

.cartaz{position:relative;background:var(--papel);border:2px solid var(--tinta);display:flex;flex-direction:column;min-width:0}
.cartaz .abrir{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;flex:1;min-width:0}
.capa{position:relative;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--cc,#777);border-bottom:2px solid var(--tinta)}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.etq{position:absolute;left:8px;top:8px;z-index:2;background:var(--cor);color:var(--tc);font:400 1.1rem/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px 3px}
/* cartaz tipográfico: quando não há imagem, o próprio título vira lambe-lambe */
.tipo{position:absolute;inset:0;background:var(--cor);color:var(--tc);padding:38px 12px 10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.tipo::after{content:"";position:absolute;inset:0;mix-blend-mode:multiply;opacity:.5;background-image:radial-gradient(circle, rgba(0,0,0,.3) 1.1px, transparent 1.5px);background-size:6px 6px;-webkit-mask-image:linear-gradient(160deg, transparent 30%, #000);mask-image:linear-gradient(160deg, transparent 30%, #000)}
.tipo b{font:400 var(--tf,2.4rem)/.86 var(--disp);text-transform:uppercase;position:relative;z-index:1;overflow-wrap:anywhere;text-shadow:2px 2px 0 var(--sobre)}
.tipo i{font:600 .78rem/1.1 var(--cond);font-style:normal;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;position:relative;z-index:1;opacity:.85}
.cartaz .corpo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cartaz h3{margin:0;font:700 1.04rem/1.18 var(--txt);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cartaz .art{font-size:.86rem;color:var(--mudo);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cartaz .onde{font-size:.86rem}
.cartaz .quando{font:600 .84rem/1.25 var(--cond);letter-spacing:.03em;margin-top:2px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{font:700 .7rem/1 var(--cond);letter-spacing:.07em;text-transform:uppercase;border:1.5px solid var(--tinta);padding:4px 6px 3px;white-space:nowrap}
.pill.gratis{border-color:var(--ok);color:var(--ok)}
.pill.tbc{border-style:dashed;border-color:var(--fio2);color:var(--mudo)}
.pill.esg{border-color:var(--aviso);color:var(--aviso)}
.pill.g{background:var(--cor);color:var(--tc);border-color:var(--cor)}
.quero{position:absolute;right:8px;top:8px;z-index:3;width:44px;height:44px;display:grid;place-items:center;background:var(--papel);border:2px solid var(--tinta);color:var(--tinta)}
.quero svg{width:20px;height:20px}
.quero[aria-pressed="true"]{background:var(--lina);border-color:var(--lina);color:#fff}
.quero[aria-pressed="true"] path{fill:currentColor}
.mais{display:block;margin:20px auto 0;border:2px solid var(--tinta);background:var(--papel);padding:12px 22px;font:700 .82rem/1 var(--cond);letter-spacing:.1em;text-transform:uppercase}
.vazio{padding:46px 8px;text-align:center;color:var(--mudo)}
.vazio b{display:block;color:var(--tinta);font:400 2rem/1 var(--disp);text-transform:uppercase;margin-bottom:8px}
.heroi{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:24px 0 10px}
.heroi .num{font:400 3.4rem/.8 var(--disp)}
.heroi .rot{font:600 .95rem/1.2 var(--cond);letter-spacing:.04em}
.heroi .rot em{font-style:normal;color:var(--mudo)}

/* destaque e notas (camada editorial, à maneira de revista: foto grande, título em caixa alta) */
.destaque{position:relative;margin:26px 0 0;background:#131312;color:#eeebe4;border:2px solid var(--tinta)}
.destaque .abrir{border:0;background:none;padding:0;color:inherit;text-align:left;display:grid;width:100%}
.destaque .capa{aspect-ratio:16/11;border-bottom:0}
.destaque .capa .etq{display:none}
.destaque .txt{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px}
.destaque .kick{font:700 .74rem/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--cor)}
.destaque h2{margin:0;font:400 clamp(2.4rem,9vw,4.4rem)/.86 var(--disp);text-transform:uppercase;overflow-wrap:anywhere}
.destaque .onde{font-size:.92rem;opacity:.85}
.destaque .quando{font:600 .9rem/1.2 var(--cond);letter-spacing:.04em}
.destaque .quero{top:10px;right:10px}
@media (min-width:860px){.destaque .abrir{grid-template-columns:1.55fr 1fr}.destaque .capa{aspect-ratio:auto;min-height:360px;height:100%}.destaque .txt{justify-content:flex-end;padding:22px}}
.nota .secao-cab{flex-wrap:wrap}
.nota .secao-cab h2{font-size:2.2rem;text-shadow:none}
.nota .secao-cab .kick{white-space:nowrap}
.nota .secao-cab .kick{font:700 .7rem/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--mudo);padding-bottom:6px}

/* ---------- programação ---------- */
.dias{position:sticky;top:var(--topo);z-index:20;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 16px;margin:0 -16px;scrollbar-width:none;border-bottom:1px solid var(--fio)}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:none;min-width:54px;border:2px solid var(--tinta);background:var(--papel);padding:5px 6px 4px;text-align:center;position:relative}
.dias button span{display:block;font:600 .66rem/1 var(--cond);letter-spacing:.1em;text-transform:uppercase}
.dias button b{display:block;font:400 1.75rem/1 var(--disp)}
.dias button i{display:block;font:500 .62rem/1 var(--cond);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--mudo)}
.dias button.todos{font:400 1.25rem/1 var(--disp);text-transform:uppercase;padding:0 12px}
.dias button[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}
.dias button[aria-pressed="true"] i{color:inherit;opacity:.7}
.dias button.hoje::after{content:"";position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:var(--lina)}
.dias button:disabled{opacity:.3;cursor:default}
.dia{margin-top:18px}
.dia-cab{display:flex;align-items:center;gap:10px;margin:0 0 4px;padding:10px 0 6px;border-bottom:3px solid var(--tinta)}
.dia-cab h2{margin:0;font:400 2.3rem/.9 var(--disp);text-transform:uppercase}
.dia-cab .rel{background:var(--lina);color:#fff;font:700 .72rem/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px 3px}
.dia-cab .q{margin-left:auto;font:600 .85rem/1 var(--cond);color:var(--mudo);letter-spacing:.05em}
.periodo{font:700 .72rem/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--mudo);margin:16px 0 2px}
.linhas{list-style:none;margin:0;padding:0}
.linha{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--fio);align-items:start}
.linha .hora{font:400 1.75rem/1 var(--disp);border-left:6px solid var(--cor);padding-left:8px;min-height:40px}
.linha .hora.tbc{font:600 .74rem/1.15 var(--cond);letter-spacing:.03em;color:var(--mudo);text-transform:uppercase}
.linha .hora small{display:block;font:600 .64rem/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--lina);margin-top:3px}
.linha .abrir{border:0;background:none;padding:0;text-align:left;min-width:0}
.linha h3{margin:0;font:700 1.02rem/1.2 var(--txt);overflow-wrap:anywhere}
.linha .onde{font-size:.84rem;color:var(--mudo);margin-top:2px}
.linha .pills{margin-top:6px}
.linha .lado{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.mais-ag{width:44px;height:44px;border:2px solid var(--tinta);background:var(--papel);display:grid;place-items:center;margin-left:auto}
.mais-ag svg{width:18px;height:18px}
.mais-ag[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}
.comprar{display:inline-block;text-align:center;background:var(--lina);color:#fff;text-decoration:none;font:700 .74rem/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:8px 8px 7px;white-space:nowrap}
.conflito{grid-column:2/-1;font:600 .82rem/1.25 var(--txt);color:var(--aviso);display:flex;gap:6px;align-items:flex-start}
.conflito svg{flex:none;width:16px;height:16px;margin-top:1px}
details.diatodo{margin:14px 0 0;border:2px solid var(--tinta);background:var(--papel)}
details.diatodo summary{cursor:pointer;padding:10px 12px;font:700 .8rem/1.1 var(--cond);letter-spacing:.1em;text-transform:uppercase;list-style:none;display:flex;gap:8px;align-items:center}
details.diatodo summary::-webkit-details-marker{display:none}
details.diatodo summary::after{content:"+";margin-left:auto;font:400 1.4rem/1 var(--disp)}
details.diatodo[open] summary::after{content:"–"}
details.diatodo .linhas{padding:0 12px}


/* ---------- cinema ---------- */
.cine-bar{display:flex;gap:6px;margin:10px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.cine-bar::-webkit-scrollbar{display:none}
.cine-bar button{flex:none;min-height:44px}
.cine-bar button{border:2px solid var(--tinta);background:var(--papel);padding:7px 10px 6px;font:700 .74rem/1 var(--cond);letter-spacing:.08em;text-transform:uppercase}
.cine-bar button[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}
.cine-bar .dir{margin-left:auto}
.filmes{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px;margin-top:14px}
@media (min-width:560px){.filmes{grid-template-columns:repeat(3,1fr)}}
@media (min-width:860px){.filmes{grid-template-columns:repeat(5,1fr)}}
@media (min-width:1120px){.filmes{grid-template-columns:repeat(6,1fr)}}
.filme .abrir{border:0;background:none;padding:0;text-align:left;width:100%;display:flex;flex-direction:column;gap:3px}
.poster{position:relative;display:block;aspect-ratio:2/3;background:var(--cc,#2a2a28);border:2px solid var(--tinta);overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .tipo{padding:12px 10px}
.filme h3{margin:6px 0 0;font:700 .96rem/1.15 var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filme .meta .arte{font:700 .62rem/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--tinta);padding:3px 4px 2px;color:var(--tinta)}
.mapa{font:700 .72rem/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--lina);display:inline-block;padding:6px 0}
.sala-abre{border:0;background:none;padding:0;text-align:left;min-width:0;width:100%}
.sala-abre .resumo{font:600 .82rem/1.3 var(--cond);letter-spacing:.03em;margin-top:2px}
.sala-abre .resumo u{color:var(--lina);text-underline-offset:3px}
.filme .meta{display:flex;gap:6px;align-items:center;font:600 .76rem/1 var(--cond);letter-spacing:.04em;color:var(--mudo)}
.filme .quando{font:600 .8rem/1.2 var(--cond);letter-spacing:.03em}
.ci{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 3px;font:700 .72rem/1 var(--txt);color:#fff;background:#555}
.ci.L{background:#0a8f3c}.ci.c10{background:#1c6fd1}.ci.c12{background:#e8b100;color:#131312}.ci.c14{background:#e46b12}.ci.c16{background:#d01f1f}.ci.c18{background:#131312;box-shadow:inset 0 0 0 1px #777}
.salas{margin-top:12px}
.sala{background:var(--papel);border:2px solid var(--tinta);padding:12px;margin-bottom:12px}
.sala h3{margin:0;font:400 1.7rem/.95 var(--disp);text-transform:uppercase}
.sala .end{font-size:.82rem;color:var(--mudo);margin:4px 0 8px}
.sala .fl{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--fio);align-items:start}
.sala .fl button{border:0;background:none;padding:0;text-align:left}
.sala .fl .mini-p{display:block;width:44px;aspect-ratio:2/3;background:var(--cc,#444);overflow:hidden;border:1.5px solid var(--tinta)}
.sala .fl .mini-p img{width:100%;height:100%;object-fit:cover;display:block}
.sala .fl b{display:block;font:700 .92rem/1.2 var(--txt)}
.horas{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.hr{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:1.5px solid var(--tinta);padding:5px 8px 4px;font:400 1.15rem/1 var(--disp);text-decoration:none;color:var(--tinta);background:var(--bg);max-width:100%}
.hr i{font:700 .6rem/1 var(--cond);font-style:normal;letter-spacing:.06em;color:var(--mudo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
a.hr:hover{background:var(--tinta);color:var(--bg)}
a.hr:hover i{color:inherit}
span.hr{opacity:.6}
.fcab-filme{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;padding:16px 64px 0 16px}
.fcab-filme h2{margin:0;font:400 2.2rem/.9 var(--disp);text-transform:uppercase;overflow-wrap:anywhere}
.fcab-filme .orig{font-size:.84rem;color:var(--mudo);margin-top:4px;font-style:italic}
.fcab-filme .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font:600 .8rem/1.2 var(--cond);letter-spacing:.04em;color:var(--mudo)}
.fdias{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.fdias::-webkit-scrollbar{display:none}
.fdias button{flex:none;min-height:44px;border:2px solid var(--tinta);background:none;padding:6px 10px 5px;font:700 .72rem/1 var(--cond);letter-spacing:.08em;text-transform:uppercase}
.fdias button[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}
.fdias button:disabled{opacity:.3}
.fsalas{list-style:none;margin:0;padding:0 16px 24px}
.fsalas li{padding:11px 0;border-bottom:1px solid var(--fio)}
.fsalas li b{display:block;font:700 .98rem/1.2 var(--txt)}
.fsalas li span.end{font-size:.8rem;color:var(--mudo)}

/* ---------- palcos ---------- */
.zonas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 4px}
@media (min-width:640px){.zonas{grid-template-columns:repeat(6,1fr)}}
.zonas button{border:2px solid var(--tinta);background:var(--papel);padding:7px 8px 6px;text-align:left}
.zonas b{display:block;font:400 1.5rem/1 var(--disp);text-transform:uppercase}
.zonas span{font:600 .72rem/1 var(--cond);letter-spacing:.08em;color:var(--mudo);text-transform:uppercase}
.zonas button[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}
.zonas button[aria-pressed="true"] span{color:inherit;opacity:.75}
.zonas button:disabled{opacity:.3}
.zona-tit{font:700 .78rem/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--mudo);margin:26px 0 8px}
.palco{background:var(--papel);border:2px solid var(--tinta);padding:12px 12px 10px;margin-bottom:14px}
.palco-cab{display:grid;grid-template-columns:1fr 44px;gap:4px 10px;align-items:start}
.palco h3{margin:0;font:400 1.9rem/.92 var(--disp);text-transform:uppercase}
.palco .end{font-size:.84rem;color:var(--mudo);margin-top:4px}
.palco .resumo{font:600 .84rem/1.3 var(--cond);letter-spacing:.03em;margin:8px 0 10px}
.fav{width:44px;height:44px;border:2px solid var(--tinta);background:none;display:grid;place-items:center}
.fav svg{width:20px;height:20px}
.fav[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}
.fav[aria-pressed="true"] path{fill:currentColor}
.mini{display:grid;grid-auto-flow:column;grid-auto-columns:124px;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;overscroll-behavior-x:contain}
.mini button{border:0;background:none;padding:0;text-align:left;min-width:0}
.mini .capa{aspect-ratio:3/4;border:2px solid var(--tinta)}
.mini .capa .tipo{padding:26px 8px 8px}
.mini .capa .tipo b{text-shadow:none}
.mini .capa .tipo i{display:none}
.mini .capa .etq{font-size:.82rem;left:5px;top:5px;padding:3px 5px 2px}
.mini b{display:block;font:700 .8rem/1.15 var(--txt);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini i{display:block;font:600 .7rem/1.2 var(--cond);font-style:normal;letter-spacing:.04em;color:var(--mudo);margin-top:2px}

/* ---------- você ---------- */
.seg{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.seg button{border:2px solid var(--tinta);background:var(--papel);padding:9px 12px 8px;font:700 .8rem/1 var(--cond);letter-spacing:.1em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}

/* ---------- rodapé ---------- */
.rodape{margin:44px 0 16px;padding-top:12px;border-top:3px solid var(--tinta);font:500 .82rem/1.4 var(--cond);letter-spacing:.03em;color:var(--mudo)}
.rodape button{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font:inherit}
.saude{list-style:none;padding:0;margin:8px 0 0;display:none}
.saude.on{display:block}
.saude li{padding:3px 0}
.ponto{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}
.ponto.mal{background:var(--aviso)}

/* ---------- folhas (detalhe e filtros) ---------- */
dialog{border:0;padding:0;background:var(--papel);color:var(--tinta);max-height:100dvh}
dialog::backdrop{background:rgba(12,12,11,.6)}
#det{width:100%;max-width:720px;height:auto;max-height:94dvh;border:3px solid var(--tinta)}
@media (max-width:719px){ #det{margin:auto 0 0;max-width:none;width:100%;max-height:94dvh;border-width:3px 0 0} }
.folha{display:flex;flex-direction:column;max-height:inherit}
.folha .rolar{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.folha .capa{aspect-ratio:auto;height:min(46vh,380px);border-bottom:3px solid var(--tinta)}
.folha .capa.sem{height:64px}
.folha .capa.sem .tipo b,.folha .capa.sem .tipo i{display:none}
.fechar{position:absolute;right:10px;top:10px;z-index:5;width:44px;height:44px;border:2px solid var(--tinta);background:var(--papel);display:grid;place-items:center}
.fechar svg{width:20px;height:20px}
.folha .cab{padding:14px 16px 0}
.folha .gen{display:inline-block;background:var(--cor);color:var(--tc);font:400 1.15rem/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;padding:4px 8px 3px}
.folha h2{margin:10px 0 0;font:400 2.7rem/.88 var(--disp);text-transform:uppercase;overflow-wrap:anywhere}
.folha .art{font-weight:600;margin-top:8px}
.folha .local{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.folha .local div{flex:1;min-width:0}
.folha .local b{display:block;font:700 1rem/1.2 var(--txt)}
.folha .local span{font-size:.86rem;color:var(--mudo)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px 0}
.btn{border:2px solid var(--tinta);background:none;padding:10px 14px 9px;font:700 .78rem/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:7px;color:var(--tinta)}
.btn svg{width:16px;height:16px}
.btn[aria-pressed="true"]{background:var(--lina);border-color:var(--lina);color:#fff}
.btn[aria-pressed="true"] path{fill:currentColor}
.folha .meta.pills{padding:14px 16px 0}
.folha .sobre{padding:0 16px}
.folha .sobre p{margin:12px 0 0;line-height:1.5}
.folha .sobre p.corta{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.folha .lermais{border:0;background:none;padding:6px 0 0;font:700 .78rem/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--lina);text-decoration:underline;text-underline-offset:3px}
.folha h3{display:flex;justify-content:space-between;align-items:baseline;margin:22px 16px 0;padding-bottom:5px;border-bottom:3px solid var(--tinta);font:400 1.7rem/1 var(--disp);text-transform:uppercase}
.folha h3 small{font:600 .78rem/1 var(--cond);letter-spacing:.06em;color:var(--mudo);text-transform:none}
.sess{list-style:none;margin:0;padding:0 16px 24px}
.sess li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--fio)}
.sess .q{font:600 .76rem/1.1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--mudo)}
.sess .q b{display:block;font:400 1.6rem/1 var(--disp);color:var(--tinta);letter-spacing:.01em;margin-top:2px}
.sess .q em{font-style:normal}
.sess .lado{display:flex;gap:6px;align-items:center}
.sess .ag{border:2px solid var(--tinta);background:none;padding:8px 10px 7px;font:700 .72rem/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sess .ag[aria-pressed="true"]{background:var(--tinta);color:var(--bg)}
.sess .pag{font:700 .72rem/1 var(--cond);letter-spacing:.08em;text-transform:uppercase}
.sess .conf{grid-column:1/-1;font-size:.82rem;font-weight:600;color:var(--aviso)}

#filtros{width:min(420px,100%);height:100dvh;margin:0 0 0 auto;border-left:3px solid var(--tinta)}
#filtros .folha{height:100%}
#filtros .fcab{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:3px solid var(--tinta)}
#filtros .fcab h2{margin:0;font:400 2.4rem/1 var(--disp);text-transform:uppercase}
#filtros .rolar{flex:1;padding:6px 16px 16px}
.rot{display:block;font:700 .72rem/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--mudo);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--tinta);background:none;padding:8px 10px 7px;font:600 .92rem/1 var(--txt);display:inline-flex;gap:6px;align-items:baseline}
.chips button i{font-style:normal;font:600 .78rem/1 var(--cond);color:var(--mudo)}
.chips button[aria-pressed="true"]{background:var(--cor,var(--tinta));border-color:var(--cor,var(--tinta));color:var(--tc,var(--bg))}
.chips button[aria-pressed="true"] i{color:inherit;opacity:.8}
.chips button:disabled{opacity:.35}
#filtros select{width:100%;border:2px solid var(--tinta);background:var(--bg);padding:11px 10px;border-radius:0;font-size:1rem}
.chave{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-top:2px solid var(--tinta);border-bottom:2px solid var(--tinta);margin-top:20px;font-weight:600}
.chave input{width:24px;height:24px;accent-color:var(--tinta)}
#filtros .fpe{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:3px solid var(--tinta)}
#filtros .fpe button{border:2px solid var(--tinta);background:none;padding:14px 8px;font:700 .82rem/1 var(--cond);letter-spacing:.12em;text-transform:uppercase}
#filtros .fpe .cheio{background:var(--tinta);color:var(--bg)}
@media (prefers-reduced-motion: no-preference){
  dialog[open]{animation:sobe .22s cubic-bezier(.2,.8,.2,1)}
  #filtros[open]{animation:entra .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes sobe{from{transform:translateY(24px);opacity:.6}}
  @keyframes entra{from{transform:translateX(30px);opacity:.6}}
}
</style>
</head>
<body>
<header class="topo">
  <div class="casca">
    <a class="marca" href="./" aria-label="Vão, início">
      <svg viewBox="0 0 38 26" aria-hidden="true"><rect x="0" y="3" width="38" height="11" fill="currentColor"/><rect x="2" y="0" width="5" height="26" fill="var(--lina)"/><rect x="31" y="0" width="5" height="26" fill="var(--lina)"/></svg>
      <span>Vão<small>o que tem em são paulo</small></span>
    </a>
    <span class="esp"></span>
    <nav class="abas-topo" role="tablist" aria-label="Seções">
      <button role="tab" data-vista="cartaz" aria-selected="true">Em cartaz</button>
      <button role="tab" data-vista="prog" aria-selected="false">Programação</button>
      <button role="tab" data-vista="cinema" aria-selected="false">Cinema</button>
      <button role="tab" data-vista="palcos" aria-selected="false">Lugares</button>
      <button role="tab" data-vista="voce" aria-selected="false">Salvos</button>
    </nav>
    <button class="ico" id="b-busca" type="button" aria-label="Buscar" aria-pressed="false" aria-controls="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>
    </button>
    <button class="ico" id="tema" type="button" aria-label="Alternar tema claro ou escuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </div>
</header>

<div class="busca" id="busca" hidden>
  <div class="casca">
    <label for="q" class="sr">Buscar por título, artista, palco ou bairro</label>
    <svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>
    <input id="q" type="search" placeholder="Título, artista, palco ou bairro" autocomplete="off" enterkeyhint="search">
    <button type="button" class="x" id="q-fechar" aria-label="Fechar busca"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>

<div class="casca">
  <div id="c-janelas">
    <div class="barra">
      <div class="janelas" role="group" aria-label="Período">
        <button type="button" data-j="hoje" aria-pressed="false"><span>Hoje</span><b>–</b></button>
        <button type="button" data-j="semana" aria-pressed="false"><span>Semana</span><b>–</b></button>
        <button type="button" data-j="mes" aria-pressed="false"><span>Mês</span><b>–</b></button>
        <button type="button" data-j="tudo" aria-pressed="false"><span>Tudo</span><b>–</b></button>
        <button type="button" data-j="datas" aria-pressed="false"><span>Datas</span><b>···</b></button>
      </div>
      <button type="button" class="ico bfiltro" id="b-filtros" aria-label="Filtros" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        <span class="bolinha" id="n-filtros" hidden></span>
      </button>
    </div>
    <div class="datas" id="datas">
      <label>De<input type="date" id="de"></label>
      <label>Até<input type="date" id="ate"></label>
    </div>
  </div>
  <main id="painel" aria-live="polite"></main>
  <footer class="rodape">
    <span id="r-data">–</span> · <button type="button" id="r-fontes" aria-expanded="false" aria-controls="saude">fontes</button>
    <ul class="saude" id="saude"></ul>
  </footer>
</div>

<nav class="nav" role="tablist" aria-label="Seções">
  <button role="tab" data-vista="cartaz" aria-selected="true"><svg viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect class="f" x="2" y="2" width="9" height="14"/><rect x="15" y="2" width="9" height="14"/></svg>Em cartaz</button>
  <button role="tab" data-vista="prog" aria-selected="false"><svg viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect class="f" x="2" y="2" width="5" height="4"/><path d="M10 4h14M10 10h14M10 16h9"/><rect x="2" y="8" width="5" height="4"/></svg>Programação</button>
  <button role="tab" data-vista="cinema" aria-selected="false"><svg viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect class="f" x="7" y="3" width="12" height="12"/><path d="M2 3h22v12H2zM7 3v12M19 3v12M2 7h5M2 11h5M19 7h5M19 11h5"/></svg>Cinema</button>
  <button role="tab" data-vista="palcos" aria-selected="false"><svg viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path class="f" d="M3 17V7h20v10"/><path d="M1 4h24M6 17V10M20 17V10"/></svg>Lugares</button>
  <button role="tab" data-vista="voce" aria-selected="false"><svg viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path class="f" d="M13 16s-6-3.8-6-8.2A3.4 3.4 0 0 1 13 5.6a3.4 3.4 0 0 1 6 2.2C19 12.2 13 16 13 16z"/></svg>Salvos<span class="n" id="n-voce" hidden></span></button>
</nav>

<dialog id="det" aria-labelledby="det-tit"></dialog>
<dialog id="filtros" aria-labelledby="f-tit">
  <div class="folha">
    <div class="fcab"><h2 id="f-tit">Filtros</h2><button type="button" class="ico" id="f-fechar" aria-label="Fechar filtros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="rolar">
      <span class="rot">Gênero</span>
      <div class="chips" id="f-grupos"></div>
      <label class="rot" for="f-bairro">Bairro</label>
      <select id="f-bairro"><option value="">Todos os bairros</option></select>
      <label class="rot" for="f-palco">Palco</label>
      <select id="f-palco"><option value="">Todos os palcos</option></select>
      <label class="chave" for="f-gratis">Só gratuitos <input type="checkbox" id="f-gratis"></label>
    </div>
    <div class="fpe"><button type="button" id="f-limpar">Limpar</button><button type="button" class="cheio" id="f-ver">Ver</button></div>
  </div>
</dialog>

<script>
(function(){
"use strict";
var TZ = "America/Sao_Paulo";
var CHAVE = "vao.guia.v1";
/* papel de lambe-lambe por grupo (claro = papel; o escuro usa o mesmo papel: cartaz não muda de cor à noite) */
var PAPEL = {teatro:"#d7261e", show:"#e2207a", samba:"#118a4b", infantil:"#f5c100", danca:"#f26a1b",
  concerto:"#2445b8", standup:"#6b3fa0", forro:"#00a2b1", cinema:"#5fb4df", exposicao:"#bda372", palavra:"#a9c23b", outros:"#8f8a80"};
/* tinta deslocada (registro fora do lugar) por grupo */
var SOBRE = {teatro:"#f5c100", show:"#131312", samba:"#f5c100", infantil:"#e2207a", danca:"#2445b8",
  concerto:"#e2207a", standup:"#f5c100", forro:"#d7261e", cinema:"#2445b8", exposicao:"#d7261e", palavra:"#e2207a", outros:"#131312"};

/* hora_conhecida:false => o coletor só sabia o dia; nunca mostrar 00h. Ausência do campo = conhecida (dados antigos). */
function horaConhecida(s){ return s.hora_conhecida!==false; }

/* zona pela posição quando o bairro não está na lista: setores a partir da Praça da Sé (km aproximados) */
function zonaPorCoord(lat, lon){
  if (typeof lat!=="number" || typeof lon!=="number") return "";
  var dx=(lon+46.6333)*102, dy=(lat+23.5505)*111, d=Math.sqrt(dx*dx+dy*dy);
  if (d<3.2) return "Centro";
  if (d>45) return "";
  var ang=Math.atan2(dy,dx)*180/Math.PI; /* 0 = leste, 90 = norte */
  if (ang>=55 && ang<125) return "Norte";
  if (ang>=-125 && ang<-55) return "Sul";
  return (ang>-55 && ang<55) ? "Leste" : "Oeste";
}

function encerrada(s){
  if (!horaConhecida(s) || semHora(s)) return false;
  if (s.fim && typeof s.fim==="string") return s.fim < AGORA;
  return minutos(s.inicio)+DURACAO_MIN <= minutos(AGORA);

function lum(hex){ var n=parseInt(hex.slice(1),16), c=[n>>16&255,n>>8&255,n&255].map(function(v){ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }

function montar(){
  AGORA = agoraSP(); HOJE = AGORA.slice(0,10);
  GRUPOS = (CAT.grupos||[]).slice();
  var nRes=0;
  GRUPOS.forEach(function(g){ (g.generos||[]).forEach(function(x){ GRUPO_DE_GEN[x]=g.id; }); COR[g.id]=PAPEL[g.id]||RESERVA[(nRes++)%RESERVA.length]; });
  var fallback = GRUPOS.some(function(g){return g.id==="outros";}) ? "outros" : (GRUPOS.length?GRUPOS[GRUPOS.length-1].id:"outros");
  if (!COR[fallback]) COR[fallback]=PAPEL.outros;
  var zs = CAT.zonas || ZONAS_PADRAO; ZONAS = Object.keys(zs);
  ZONAS.forEach(function(z){ zs[z].forEach(function(b){ ZONA_DE[norm(b)]=z; }); });
  var brutas = {};
  (G.sessoes||[]).forEach(function(s){
    if (!s || !s.inicio || s.status==="cancelado" || !G.eventos[s.evento_id]) return;
    (brutas[s.evento_id] = brutas[s.evento_id]||[]).push(s);
  });
  Object.keys(G.eventos).forEach(function(id){
    var e=G.eventos[id], ss=brutas[id]; if(!ss||!ss.length) return;

    if (!p.id) p.id=e.palco_id;
    p._zona = zonaDe(p.bairro, p.lat, p.lon);
    e._palco=p; e._grupo=GRUPO_DE_GEN[e.genero]||fallback; e._raw=ss;
    e._capa = (typeof e.imagem==="string" && CAPAS[e.imagem]) || null;
    e._busca=norm([e.titulo,e.artista,p.nome,p.bairro,genRot(e.genero)].join(" "));
    RAW.push(e);
  });
  ASSINATURA = recalcular();
  var palcos={}, bairros={};

  var sp=$("#f-palco"), sb=$("#f-bairro");
  Object.keys(palcos).sort(function(a,b){return palcos[a].localeCompare(palcos[b],"pt");}).forEach(function(id){ sp.add(new Option(palcos[id], id)); });
  Object.keys(bairros).sort(function(a,b){return a.localeCompare(b,"pt");}).forEach(function(b){ sb.add(new Option(b,b)); });
  if (!F.de){ F.de=HOJE; F.ate=somaDias(HOJE,6); }

}
function recalcular(){
  AGORA = agoraSP(); HOJE = AGORA.slice(0,10);
  var ini = HOJE+"T00:00";
  EV = []; SESS_ID = {};
  RAW.forEach(function(e){
    e._ss = e._raw.filter(function(s){ return s.inicio >= ini && !encerrada(s); });
    if (!e._ss.length) return;
    e._ss.forEach(function(s){ SESS_ID[s.id]=s; });
    EV.push(e);
  });
  return HOJE+"|"+Object.keys(SESS_ID).length;
}
function atualizar(){
  if (!G) return;
  var antes = HOJE, sig = recalcular();
  if (sig === ASSINATURA) return;
  ASSINATURA = sig;
  if (antes !== HOJE){
    if (F.de < HOJE) F.de = HOJE;
    if (F.ate < F.de) F.ate = somaDias(F.de,6);
    if (DIA_PROG && DIA_PROG < HOJE) DIA_PROG = null;
    $("#de").value=F.de; $("#ate").value=F.ate; $("#de").min=HOJE; $("#ate").min=HOJE;

}

/* ---------- filtro ---------- */
function intervalo(j){
  if (j==="hoje") return [HOJE,HOJE];
  if (j==="semana") return [HOJE,somaDias(HOJE,6)];
  if (j==="mes") return [HOJE,somaDias(HOJE,30)];
  if (j==="datas") { var a=F.de||HOJE, b=F.ate||a; return a<=b?[a,b]:[b,a]; }
  return [HOJE,"9999-12-31"];
}
function sessNaJanela(e, j){ var r=intervalo(j); return e._ss.filter(function(s){ var d=s.inicio.slice(0,10); return d>=r[0]&&d<=r[1]; }); }
function passa(e, sem){
  sem=sem||{};
  if (!sem.grupo && F.grupos.size && !F.grupos.has(e._grupo)) return false;
  if (F.palco && e.palco_id!==F.palco) return false;
  if (F.bairro && e._palco.bairro!==F.bairro) return false;
  if (F.gratis && e.gratuito!==true) return false;
  if (!sem.q && F.q){ var t=norm(F.q).trim().split(/\s+/); for (var i=0;i<t.length;i++) if (e._busca.indexOf(t[i])<0) return false; }

/* mosaico: treemap "squarify" sobre a contagem de cada grupo na janela */
function squarify(itens, x, y, w, h){
  var out=[], fila=[], resto=itens.slice();
  function pior(f, lado){ var s=0,mx=0,mn=Infinity; f.forEach(function(i){ s+=i.a; if(i.a>mx)mx=i.a; if(i.a<mn)mn=i.a; }); var s2=s*s, l2=lado*lado; return Math.max(l2*mx/s2, s2/(l2*mn)); }
  function assenta(f){
    var s=0; f.forEach(function(i){ s+=i.a; });
    if (w>=h){ var ww=s/h, yy=y; f.forEach(function(i){ var hh=i.a/ww; out.push({it:i.it,x:x,y:yy,w:ww,h:hh}); yy+=hh; }); x+=ww; w-=ww; }
    else { var hh=s/w, xx=x; f.forEach(function(i){ var w2=i.a/hh; out.push({it:i.it,x:xx,y:y,w:w2,h:hh}); xx+=w2; }); y+=hh; h-=hh; }
  }
  while (resto.length){
    var lado=Math.min(w,h), c=resto[0];
    if (!fila.length || pior(fila.concat([c]),lado) <= pior(fila,lado)){ fila.push(c); resto.shift(); }
    else { assenta(fila); fila=[]; }
  }
  if (fila.length) assenta(fila);
  return out;
}
function pintarMuro(){
  var muro=$("#muro"); if(!muro) return;
  var porG={}; EV.forEach(function(e){ if (passa(e,{grupo:1}) && sessNaJanela(e,F.janela).length) porG[e._grupo]=(porG[e._grupo]||0)+1; });
  var com=GRUPOS.filter(function(g){ return porG[g.id]||F.grupos.has(g.id); }), sem=GRUPOS.filter(function(g){ return !porG[g.id] && !F.grupos.has(g.id); });
  var W=muro.clientWidth||340, H=Math.round(Math.min(Math.max(W*0.72, 230), 360));
  muro.style.height=H+"px";
  var tot=com.reduce(function(a,g){ return a+(porG[g.id]||0); },0)||1, piso=tot*0.07;
  /* espetáculo primeiro (abre o muro no canto de cima), palestra/exposição/cinema depois; dentro de cada metade, o maior primeiro */
  var FIM={palavra:1, exposicao:1, cinema:1, outros:1};
  var itens=com.map(function(g){ return {it:g, v:Math.max(porG[g.id]||0, piso), fim:FIM[g.id]?1:0}; }).sort(function(a,b){ return a.fim-b.fim || b.v-a.v; });

  muro.innerHTML = squarify(itens,0,0,W,H).map(function(r){
    var g=r.it, n=porG[g.id]||0, area=r.w*r.h, curto=Math.min(r.w,r.h);
    var fs=Math.max(15, Math.min(curto*0.42, Math.sqrt(area)*0.3, 76));
    var rot=g.rotulo; if (fs*rot.length*0.36 > r.w-14) fs=Math.max(13, (r.w-14)/(rot.length*0.36));
    var on=F.grupos.has(g.id);
    return '<button type="button" class="lambe'+(g.id===maior&&area>20000?" dobra":"")+'" data-g="'+esc(g.id)+'" aria-pressed="'+on+'" aria-label="'+esc(rot)+': '+n+' eventos" '+attrCor(g.id).replace('style="','style="left:'+(r.x+GAP/2).toFixed(1)+'px;top:'+(r.y+GAP/2).toFixed(1)+'px;width:'+Math.max(0,r.w-GAP).toFixed(1)+'px;height:'+Math.max(0,r.h-GAP).toFixed(1)+'px;--fs:'+fs.toFixed(0)+'px;--fn:'+Math.max(12,Math.min(fs*0.42,22)).toFixed(0)+'px;--reg:'+(fs>40?3:fs>24?2:0)+'px;')+'>'+
      '<span class="nn">'+n+'</span><span class="nm">'+esc(rot)+'</span></button>';
  }).join("");
  /* encaixe: encolhe o nome até caber na largura e o par número+nome até caber na altura */
  $$(".lambe", muro).forEach(function(t){
    var nm=t.querySelector(".nm"), nn=t.querySelector(".nn"), fs=parseFloat(getComputedStyle(nm).fontSize), i=0;
    while (i++<40 && fs>8 && (nm.scrollWidth>t.clientWidth-14 || nm.offsetHeight+nn.offsetHeight>t.clientHeight-12)){ fs*=0.9; nm.style.fontSize=fs.toFixed(1)+"px"; }
    if (nm.offsetHeight+nn.offsetHeight>t.clientHeight-8) nn.style.display="none";
  });
  var rod=$("#muro-rodape"); if(!rod) return;
  var nTot=EV.filter(function(e){ return passa(e) && sessNaJanela(e,F.janela).length; }).length;
  var ativos=[]; F.grupos.forEach(function(g){ ativos.push(grupoRot(g)); }); if (F.bairro) ativos.push(F.bairro); if (F.palco) ativos.push($("#f-palco").selectedOptions[0].text); if (F.gratis) ativos.push("grátis");
  rod.innerHTML='<span>'+nTot+' '+esc(rotJanela())+(sem.length?' · sem '+esc(sem.map(function(g){return g.rotulo.toLowerCase();}).join(", ")):"")+'</span>'+
    (ativos.length?'<span class="ativos">'+esc(ativos.join(" + "))+' · <button type="button" id="limpar">limpar</button></span>':"");

/* ---------- cinema (dados/cinema.json: salas comerciais pelo Ingresso.com) ---------- */
var CIN=null, CIN_ERRO=false, CIN_PEDIDO=null, DIA_CIN=null, CSEG="filmes", CZONA="", CIDIOMA="", CCIRC="", CABERTO=new Set();
function carregarCinema(){
  if (CIN_PEDIDO) return CIN_PEDIDO;
  var arq = PARAM_CIN && /^[\w.-]+\.json$/.test(PARAM_CIN) ? "dados/"+PARAM_CIN : "dados/cinema.json";
  CIN_PEDIDO = buscaJSON(arq).then(function(j){
    if (!j || !j.filmes || !j.sessoes) throw new Error("cinema.json sem filmes");
    Object.keys(j.cinemas||{}).forEach(function(k){ var c=j.cinemas[k]; c._circ=circuitoCinema(c); c._zona=zonaDe(c.bairro, c.lat, c.lon)||"Outras"; c._busca=norm([c.nome,c.rede,c.bairro].join(" ")); });
    Object.keys(j.filmes).forEach(function(k){ var f=j.filmes[k]; if (!f.cartaz && f.cartaz_h) f.cartaz=f.cartaz_h; f._capa=(typeof f.cartaz==="string"&&CAPAS[f.cartaz])||null; f._busca=norm([f.titulo,f.original,f.direcao].join(" ")); });
    CIN=j; if (VISTA==="cinema") render();
  }).catch(function(e){ CIN_ERRO=true; console.warn(e); if (VISTA==="cinema") render(); });
  return CIN_PEDIDO;
}
var REDES_COMERCIAIS = ["cinemark","cinepolis","uci","kinoplex","cinesystem","moviecom","cine araujo","cineflix","playarte"];
function circuitoCinema(c){
  var cfg = CIRC && CIRC.cinema || {}, id=String(c.id||""), n=norm((c.rede||"")+" "+(c.nome||""));
  if ((cfg.independente||[]).indexOf(id)>=0) return "arte";
  if ((cfg.comercial||[]).indexOf(id)>=0) return "comercial";
  var redes = (cfg.redes_comerciais||REDES_COMERCIAIS).map(norm);
  return redes.some(function(r){ return n.indexOf(r)>=0; }) ? "comercial" : "arte";
}
function classeCI(c){ c=String(c||"").trim(); if (/^l$|^livre/i.test(c)) return {k:"L",t:"L"}; var m=c.match(/\d+/); return m?{k:"c"+m[0],t:m[0]}:null; }
function ciHTML(c){ var x=classeCI(c); return x?'<span class="ci '+x.k+'" title="Classificação: '+esc(c)+'">'+x.t+'</span>':""; }
function duracao(m){ m=+m; if(!m) return ""; var h=Math.floor(m/60), r=m%60; return h?h+"h"+(r?String(r).padStart(2,"0"):""):r+" min"; }
function posterHTML(f){
  var c=f._capa;
  if (c&&c.f) return '<span class="poster" style="--cc:'+esc(c.cor||"#333")+'"><img src="'+esc(c.f)+'" width="'+(+c.w||400)+'" height="'+(+c.h||600)+'" alt="" loading="lazy" decoding="async"></span>';

  return '<span class="poster" style="--cor:'+PAPEL.cinema+';--tc:#131312;--sobre:'+SOBRE.cinema+'"><span class="tipo" style="--tf:1.7rem"><b>'+esc(f.titulo)+'</b></span></span>';
}
function tiposTxt(t){ return (t||[]).filter(function(x){ return x!=="NAC"; }).join(" "); }
function temIdioma(s, id){ var t=s.tipos||[]; return t.indexOf(id)>=0 || t.indexOf("NAC")>=0; }
function sessoesCine(dia){
  var lim = dia===HOJE ? AGORA : "";
  var q = F.q ? norm(F.q).trim().split(/\s+/) : [];
  return CIN.sessoes.filter(function(s){

function semHora(s){ if (!horaConhecida(s)) return true; var e=G.eventos[s.evento_id]; return !!e && e.genero==="exposicao"; }
function conflitos(lista){
  var m={};
  for (var i=0;i<lista.length;i++) for (var j=i+1;j<lista.length;j++){
    var a=lista[i], b=lista[j]; if (a.inicio.slice(0,10)!==b.inicio.slice(0,10)) break;
    if (semHora(a) || semHora(b)) continue;
    var d=Math.abs(minutos(b.inicio)-minutos(a.inicio)); if (d<100){ (m[a.id]=m[a.id]||[]).push({s:b,dm:d}); (m[b.id]=m[b.id]||[]).push({s:a,dm:d}); }
  }
  return m;
}

}
function fechar(){ var d=$("#det"); if(d.open){ if(d.close) d.close(); else d.removeAttribute("open"); } }
$("#det").addEventListener("close", function(){ if(ULTIMO_FOCO&&ULTIMO_FOCO.focus) try{ULTIMO_FOCO.focus();}catch(e){} });
$("#det").addEventListener("click", function(ev){
  if (ev.target===this) return fechar();
  var t=ev.target.closest("button"); if(!t) return;
  if (t.id==="det-fechar") return fechar();
  if (t.id==="det-ler"){ $("#det-sobre").classList.remove("corta"); t.hidden=true; return; }
  if (t.id==="det-partilha"){ partilhar(); return; }
  if (t.dataset.sess){ var id=t.dataset.sess; AGENDA.has(id)?AGENDA.delete(id):AGENDA.add(id); persistir();
    var e=G.eventos[SESS_ID[id].evento_id]; pintarSessoes(e); var nb=$('[data-sess="'+CSS.escape(id)+'"]',this); if(nb) nb.focus(); render(); }
  if (t.dataset.quero){ alternarQuero(t.dataset.quero); t.setAttribute("aria-pressed",QUERO.has(t.dataset.quero)); t.querySelector("span").textContent=QUERO.has(t.dataset.quero)?"Na lista":"Quero ver"; }
  if (t.dataset.fav){ alternarFav(t.dataset.fav); t.setAttribute("aria-pressed", FAV.has(t.dataset.fav)); }
  if (t.dataset.fdia){ var fd=t.dataset.fdia; abrirFilme(FILME_ABERTO, fd); var nb3=$('[data-fdia="'+fd+'"]',this); if(nb3) nb3.focus(); }
});
var EV_ABERTO=null;
function partilhar(){
  var tit=$("#det-tit").textContent, ev=EV_ABERTO&&G.eventos[EV_ABERTO], fm=!ev&&FILME_ABERTO&&CIN&&CIN.filmes[FILME_ABERTO];
  var url=(ev&&urlSegura(ev.url))||(fm&&urlSegura(fm.url))||location.href;
  var txt=tit+(ev?" · "+ev._palco.nome+" · "+quandoTxt(ev):(fm?" · em cartaz em São Paulo":""));
  if (navigator.share) navigator.share({title:tit, text:txt, url:url}).catch(function(){});
  else if (navigator.clipboard) navigator.clipboard.writeText(txt+"\n"+url).then(function(){ var b=$("#det-partilha span"); if(b) b.textContent="Copiado"; }, function(){});
}
function alternarQuero(id){ QUERO.has(id)?QUERO.delete(id):QUERO.add(id); persistir(); render(); }
function alternarFav(id){ FAV.has(id)?FAV.delete(id):FAV.add(id); persistir(); render(); }

/* ---------- filtros (gaveta) ---------- */
function pintarFiltros(){
  var porG={}; EV.forEach(function(e){ if (passa(e,{grupo:1}) && sessNaJanela(e,F.janela).length) porG[e._grupo]=(porG[e._grupo]||0)+1; });
  $("#f-grupos").innerHTML=GRUPOS.map(function(g){ var n=porG[g.id]||0, on=F.grupos.has(g.id);
    return '<button type="button" data-g="'+esc(g.id)+'" aria-pressed="'+on+'" '+attrCor(g.id)+(n||on?"":" disabled")+'>'+esc(g.rotulo)+'<i>'+n+'</i></button>'; }).join("");
  $("#f-palco").value=F.palco; $("#f-bairro").value=F.bairro; $("#f-gratis").checked=F.gratis;
  var n=EV.filter(function(e){ return passa(e) && sessNaJanela(e,F.janela).length; }).length;
  $("#f-ver").textContent="Ver "+n+(n===1?" evento":" eventos");
}
function abrirFiltros(){ pintarFiltros(); var d=$("#filtros"); if (d.showModal) d.showModal(); else d.setAttribute("open",""); }
function fecharFiltros(){ var d=$("#filtros"); if (d.open){ if(d.close) d.close(); else d.removeAttribute("open"); } }
function limparFiltros(){ F.grupos.clear(); F.palco=""; F.bairro=""; F.gratis=false; LIMITE=48; }

/* ---------- ligações ---------- */
function contarAbas(){ var n=sessoesAgenda().length+QUERO.size, b=$("#n-voce"); b.hidden=!n; b.textContent=n; }
function rodape(){
  var g=G.gerado_em||""; var dt=g.slice(0,10);
  var fontes=G.fontes||{}, ks=Object.keys(fontes), ok=ks.filter(function(k){return fontes[k]&&fontes[k].ok;}).length;
  var velho = dt && difDias(dt,HOJE)>1;
  $("#r-data").innerHTML="dados de "+(dt?esc(rotDia(dt))+(g.length>12?", "+esc(hora(g)):""):"data desconhecida")+(velho?' <strong style="color:var(--aviso)">(desatualizado)</strong>':"")+(G.__url.indexOf("mock")>=0||G.__url.indexOf("exemplo")>=0?" · amostra":"");
  $("#r-fontes").innerHTML='<span class="ponto'+(ok<ks.length?" mal":"")+'"></span>'+ok+" de "+ks.length+" fontes ok";
  $("#saude").innerHTML=ks.map(function(k){ var f=fontes[k]||{}; return '<li><span class="ponto'+(f.ok?"":" mal")+'"></span><b>'+esc(k)+'</b> · '+(f.ok?(f.eventos||0)+" eventos, "+(f.sessoes||0)+" sessões":esc(f.erro||"falhou"))+'</li>'; }).join("");
}
function irVista(v){ VISTA=v; LIMITE=48; render(); window.scrollTo(0,0); }
function abrirBusca(){ var b=$("#busca"); b.hidden=false; $("#b-busca").setAttribute("aria-pressed","true"); var q=$("#q"); q.focus(); q.select(); }
function fecharBusca(){ $("#busca").hidden=true; $("#b-busca").setAttribute("aria-pressed","false"); if (F.q){ F.q=""; $("#q").value=""; render(); } }
function ligar(){
  $$("[data-vista]").forEach(function(b){ b.addEventListener("click", function(){ irVista(b.dataset.vista); }); });
  $$(".janelas button").forEach(function(b){ b.addEventListener("click", function(){ F.janela=b.dataset.j; LIMITE=48; render(); }); });
  $("#de").addEventListener("change", function(){ F.de=this.value||HOJE; render(); });
  $("#ate").addEventListener("change", function(){ F.ate=this.value||F.de; render(); });
  $("#b-busca").addEventListener("click", function(){ $("#busca").hidden ? abrirBusca() : fecharBusca(); });
  $("#q-fechar").addEventListener("click", fecharBusca);
  var t; $("#q").addEventListener("input", function(){ var v=this.value; clearTimeout(t); t=setTimeout(function(){ F.q=v; LIMITE=48; render(); }, 60); });
  $("#b-filtros").addEventListener("click", abrirFiltros);
  $("#f-fechar").addEventListener("click", fecharFiltros);
  $("#filtros").addEventListener("click", function(ev){ if (ev.target===this) fecharFiltros(); });
  $("#f-grupos").addEventListener("click", function(ev){ var b=ev.target.closest("button"); if(!b||b.disabled) return; var g=b.dataset.g; F.grupos.has(g)?F.grupos.delete(g):F.grupos.add(g); render(); pintarFiltros(); });
  $("#f-palco").addEventListener("change", function(){ F.palco=this.value; render(); pintarFiltros(); });
  $("#f-bairro").addEventListener("change", function(){ F.bairro=this.value; render(); pintarFiltros(); });
  $("#f-gratis").addEventListener("change", function(){ F.gratis=this.checked; render(); pintarFiltros(); });
  $("#f-limpar").addEventListener("click", function(){ limparFiltros(); render(); pintarFiltros(); });
  $("#f-ver").addEventListener("click", function(){ fecharFiltros(); if (VISTA==="voce") irVista("cartaz"); });
  $("#painel").addEventListener("click", function(ev){
    var b=ev.target.closest("button"); if(!b) return;
    if (b.dataset.quero){ var id=b.dataset.quero; alternarQuero(id); var nb=$('#painel [data-quero="'+CSS.escape(id)+'"]'); if(nb) nb.focus(); return; }
    if (b.dataset.sess){ var sid=b.dataset.sess, y=window.scrollY; AGENDA.has(sid)?AGENDA.delete(sid):AGENDA.add(sid); persistir(); render(); window.scrollTo(0,y); var nb2=$('#painel [data-sess="'+CSS.escape(sid)+'"]'); if(nb2) nb2.focus({preventScroll:true}); return; }
    if (b.dataset.fav){ var fk=b.dataset.fav; FAV.has(fk)?FAV.delete(fk):FAV.add(fk); persistir();
      if (VISTA==="cinema"){ b.setAttribute("aria-pressed", FAV.has(fk)); return; } /* cinema: só o botão; a ordem acompanha na próxima pintura */
      render(); return; }
    if (b.dataset.abre){ var ca=b.dataset.abre; CABERTO.has(ca)?CABERTO.delete(ca):CABERTO.add(ca); render(); var nb4=$('#painel [data-abre="'+CSS.escape(ca)+'"]'); if(nb4) nb4.focus({preventScroll:true}); return; }
    if (b.dataset.ev){ EV_ABERTO=b.dataset.ev; FILME_ABERTO=null; return abrir(b.dataset.ev); }
    if (b.dataset.g){ var g=b.dataset.g; F.grupos.has(g)?F.grupos.delete(g):F.grupos.add(g); LIMITE=48; render(); return; }
    if (b.dataset.grupo){ F.grupos.clear(); F.grupos.add(b.dataset.grupo); LIMITE=48; render(); var m=$("#muro"); if(m) m.scrollIntoView({block:"start"}); return; }
    if (b.dataset.dia!==undefined){ DIA_PROG=b.dataset.dia||null; LIM_PROG=160; var x=window.scrollX; render(); return; }
    if (b.dataset.zona!==undefined){ ZONA=b.dataset.zona; render(); return; }
    if (b.dataset.filme){ return abrirFilme(b.dataset.filme); }
    if (b.dataset.cdia){ DIA_CIN=b.dataset.cdia; render(); return; }
    if (b.dataset.cseg){ CSEG=b.dataset.cseg; render(); return; }
    if (b.dataset.cid!==undefined){ CIDIOMA=b.dataset.cid; render(); return; }
    if (b.dataset.ccirc!==undefined){ CCIRC=b.dataset.ccirc; render(); return; }
    if (b.dataset.czona!==undefined){ CZONA=b.dataset.czona; render(); return; }
    if (b.dataset.irvista){ irVista(b.dataset.irvista); return; }
    if (b.dataset.seg){ SEG=b.dataset.seg; render(); return; }
    if (b.id==="mais"){ LIMITE+=48; render(); }
    if (b.id==="mais-prog"){ LIM_PROG+=160; render(); }
    if (b.id==="ver-tudo"){ F.janela="tudo"; LIMITE=48; render(); }
    if (b.id==="limpar"){ limparFiltros(); render(); }
  });
  $("#r-fontes").addEventListener("click", function(){ var on=$("#saude").classList.toggle("on"); this.setAttribute("aria-expanded",String(on)); });
  document.addEventListener("keydown", function(ev){
    var tag=(ev.target.tagName||"").toLowerCase(), digitando = tag==="input"||tag==="select"||tag==="textarea";
    if ((ev.key==="k"||ev.key==="K") && (ev.ctrlKey||ev.metaKey)){ ev.preventDefault(); fechar(); abrirBusca(); }
    else if (ev.key==="/" && !digitando && !$("#det").open && !$("#filtros").open){ ev.preventDefault(); abrirBusca(); }
    else if (ev.key==="Escape" && ev.target.id==="q"){ fecharBusca(); }
  });
}
})();
</script>
</body>
</html>
